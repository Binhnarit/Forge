<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101010"><meta name="apple-mobile-web-app-capable" content="yes"><title>FORGE — Workout Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:550px;margin:auto;padding:28px 18px 110px}.eyebrow{font-size:11px;letter-spacing:3px;color:#999;font-weight:800}h1{font-size:39px;letter-spacing:-2px;margin:4px 0 5px}.muted{color:#aaa;font-size:13px}.panel{border:1px solid #333;border-radius:18px;padding:19px;margin-top:19px;background:#191919}.stats{display:flex;gap:12px}.stat{flex:1}.number{font-size:32px;font-weight:800;letter-spacing:-1px}.label{color:#999;font-size:11px;text-transform:uppercase;letter-spacing:1px}.progress{height:7px;background:#373737;border-radius:8px;overflow:hidden;margin:17px 0 8px}.fill{height:100%;background:#eee;width:0;transition:width .25s}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:20px 0}.day{border:1px solid #333;background:#1b1b1b;border-radius:12px;color:#bbb;padding:13px 0;cursor:pointer;font-size:11px;font-weight:700}.day.active{background:#f1f1f1;color:#111;border-color:#f1f1f1}.day.done:not(.active){border-color:#bcbcbc;color:#fff}.day small{display:block;margin-top:7px;font-size:13px}.heading{display:flex;justify-content:space-between;gap:8px;align-items:start}.heading h2{margin:5px 0;font-size:26px;letter-spacing:-.7px}.tag{font-size:11px;border:1px solid #444;border-radius:99px;padding:7px 10px;color:#ccc;white-space:nowrap}.exercise{display:flex;gap:12px;align-items:center;min-height:66px;padding:12px 0;border-bottom:1px solid #303030;cursor:pointer}.exercise:last-child{border-bottom:0}.exercise input{position:absolute;opacity:0}.tick{height:25px;width:25px;min-width:25px;border:2px solid #666;border-radius:7px;display:grid;place-items:center;color:transparent;font-weight:900}.exercise input:checked+.tick{background:#eee;color:#111;border-color:#eee}.exercise input:focus-visible+.tick{outline:3px solid #aaa;outline-offset:3px}.exname{font-size:14px;font-weight:650}.reps{font-size:12px;color:#999;margin-top:5px}.exercise input:checked~.extext .exname{text-decoration:line-through;color:#777}.btn{border:0;border-radius:12px;background:#f0f0f0;color:#111;font-size:14px;font-weight:800;padding:15px;width:100%;margin-top:17px;cursor:pointer}.btn:disabled{opacity:.35;cursor:default}.secondary{background:transparent;color:#aaa;border:1px solid #444}.note{line-height:1.6;color:#aaa;font-size:12px}.rest{padding:34px 10px;text-align:center;color:#aaa}.complete{color:#ddd;font-size:12px;font-weight:700;margin-top:10px}.footer{text-align:center;color:#777;font-size:11px;margin-top:26px}@media(max-width:370px){main{padding-left:12px;padding-right:12px}.day{font-size:10px}}</style></head><body><main><div class="eyebrow">TRAIN CONSISTENTLY</div><h1>FORGE<span style="color:#777">.</span></h1><div class="muted" id="dateLine"></div><section class="panel"><div class="stats"><div class="stat"><div class="number" id="streak">0</div><div class="label">Training streak 🔥</div></div><div class="stat"><div class="number" id="week">0/5</div><div class="label">This week</div></div></div><div class="progress"><div class="fill" id="fill"></div></div><div class="muted" id="progressLabel">Keep showing up.</div></section><div class="days" id="days"></div><section class="panel"><div class="heading"><div><div class="eyebrow" id="dayLabel"></div><h2 id="workoutTitle"></h2><div class="muted" id="workoutSubtitle"></div></div><div class="tag" id="count"></div></div><div id="exerciseList"></div><button class="btn" id="finish">Complete workout</button><div class="complete" id="completedText" aria-live="polite"></div></section><p class="note">Progress saves in this browser on this device. Complete the exercises at your own pace; rest days don't break your streak. For lifts, use controlled weights and good technique.</p><button class="btn secondary" id="reset">Reset selected day's checks</button><div class="footer">FORGE • SHOW UP. GET STRONGER.</div></main><script>
const workouts={0:{name:'Rest Day',sub:'Recovery • No workout scheduled',ex:[]},1:{name:'Upper A',sub:'Strength • Chest, back, shoulders & arms',ex:[['Barbell Bench Press','3 × 5–6'],['Lat Pulldown or Pull-ups','3 × 6–8'],['Seated Cable Row','3 × 6–8'],['Seated Dumbbell Shoulder Press','2 × 6–8'],['Incline Dumbbell Press','2 × 8–10'],['EZ Bar Bicep Curl','2 × 10–12'],['Tricep Pushdown','2 × 10–12']]},2:{name:'Lower A',sub:'Strength • Legs & core',ex:[['Barbell Squat','3 × 5–6'],['Romanian Deadlift','3 × 6–8'],['Leg Press','2 × 8–10'],['Seated Leg Curl','2 × 10–12'],['Standing Calf Raise','3 × 10–15'],['Hanging Knee Raise','3 × 10–15']]},3:{name:'Army Fitness',sub:'Conditioning • Running & bodyweight',ex:[['Warm-up','8 minutes'],['Run/walk intervals','20 minutes'],['Push-ups','3 × 10–15'],['Pull-ups or assisted pull-ups','3 × 4–8'],['Bodyweight Squats','3 × 12'],['Plank','3 × 30–45 sec'],['Cooldown','5 minutes']]},4:{name:'Upper B',sub:'Muscle • Chest, back, shoulders & arms',ex:[['Incline Dumbbell Bench Press','3 × 8–12'],['Chest-Supported Row','3 × 8–12'],['Lat Pulldown','3 × 10–12'],['Pec Deck / Cable Fly','2 × 12–15'],['Dumbbell Lateral Raise','3 × 12–15'],['Preacher Curl','2 × 10–12'],['Overhead Tricep Extension','2 × 10–12']]},5:{name:'Lower B',sub:'Muscle • Legs & core',ex:[['Hack Squat or Leg Press','3 × 8–12'],['Dumbbell Romanian Deadlift','2 × 8–12'],['Bulgarian Split Squat','2 × 8–10 each leg'],['Seated Leg Curl','3 × 10–15'],['Leg Extension','2 × 12–15'],['Seated Calf Raise','3 × 12–15'],['Cable Crunch','3 × 10–15']]},6:{name:'Rest Day',sub:'Recovery • No workout scheduled',ex:[]}};
const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const today=new Date();today.setHours(12,0,0,0);let selected=new Date(today);let data={};try{data=JSON.parse(localStorage.getItem('forge_workout_v1')||'{}')}catch(e){};const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const get=d=>data[key(d)]||{checks:[],complete:false};function save(){try{localStorage.setItem('forge_workout_v1',JSON.stringify(data))}catch(e){}}function weekStart(d){let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function weekDates(d){let m=weekStart(d);return Array.from({length:7},(_,i)=>{let x=new Date(m);x.setDate(m.getDate()+i);return x})}function completed(d){return !!get(d).complete}function streak(){let d=new Date(today),n=0;if([0,1].includes(d.getDay())){d.setDate(d.getDate()-(d.getDay()===0?2:3))}else if(!completed(d)){d.setDate(d.getDate()-1)}for(let i=0;i<366;i++){if([0,1].includes(d.getDay())){d.setDate(d.getDate()-1);continue}if(!completed(d))break;n++;d.setDate(d.getDate()-1)}return n}function render(){const ds=weekDates(selected);const completedCount=ds.filter(d=>![0,1].includes(d.getDay())&&completed(d)).length;document.getElementById('dateLine').textContent=today.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('streak').textContent=streak();document.getElementById('week').textContent=completedCount+'/5';document.getElementById('fill').style.width=(completedCount/5*100)+'%';document.getElementById('progressLabel').textContent=completedCount===5?'All five workouts completed this week.':`${5-completedCount} workout${5-completedCount===1?'':'s'} left this week`;
const days=document.getElementById('days');days.replaceChildren();ds.forEach(d=>{const b=document.createElement('button');b.className='day'+(key(d)===key(selected)?' active':'')+(completed(d)?' done':'');b.innerHTML=`${names[d.getDay()]}<small>${completed(d)?'✓':d.getDate()}</small>`;b.setAttribute('aria-label',d.toDateString());b.onclick=()=>{selected=d;render()};days.appendChild(b)});const w=workouts[selected.getDay()],state=get(selected),checks=state.checks||[];document.getElementById('dayLabel').textContent=selected.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();document.getElementById('workoutTitle').textContent=w.name;document.getElementById('workoutSubtitle').textContent=w.sub;document.getElementById('count').textContent=w.ex.length?`${checks.filter(Boolean).length}/${w.ex.length} checked`:'REST';const list=document.getElementById('exerciseList');list.replaceChildren();if(!w.ex.length){const p=document.createElement('div');p.className='rest';p.textContent='Take a break. Recovery is part of training.';list.appendChild(p)}else w.ex.forEach(([name,reps],i)=>{const label=document.createElement('label');label.className='exercise';const input=document.createElement('input');input.type='checkbox';input.checked=!!checks[i];input.onchange=()=>{const s=get(selected);s.checks=[...(s.checks||[])];s.checks[i]=input.checked;if(!input.checked)s.complete=false;data[key(selected)]=s;save();render()};const tick=document.createElement('span');tick.className='tick';tick.textContent='✓';const txt=document.createElement('span');txt.className='extext';const n=document.createElement('div');n.className='exname';n.textContent=name;const r=document.createElement('div');r.className='reps';r.textContent=reps;txt.append(n,r);label.append(input,tick,txt);list.appendChild(label)});const btn=document.getElementById('finish');btn.style.display=w.ex.length?'block':'none';btn.disabled=!w.ex.length||checks.filter(Boolean).length!==w.ex.length;btn.textContent=state.complete?'✓ Workout completed':'Complete workout';document.getElementById('completedText').textContent=state.complete?'Workout logged. Great consistency.':'';document.getElementById('reset').style.display=w.ex.length?'block':'none'}document.getElementById('finish').onclick=()=>{const w=workouts[selected.getDay()],s=get(selected);if(w.ex.length&&(s.checks||[]).filter(Boolean).length===w.ex.length){s.complete=true;data[key(selected)]=s;save();render()}};document.getElementById('reset').onclick=()=>{if(confirm('Clear the checks for this day?')){delete data[key(selected)];save();render()}};render();
</script></body></html>
